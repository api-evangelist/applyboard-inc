aid: applyboard-inc
name: ApplyBoard Inc.
description: 'ApplyBoard Inc. is a Kitchener-Waterloo, Canada-based education technology
  company that operates one of the world''s largest online platforms for international
  student recruitment. Its marketplace connects prospective students and recruitment
  partners with more than 1,500 educational institutions across Australia, Canada,
  Germany, Ireland, the United Kingdom, and the United States, and reports having helped
  over 1.5 million students apply to 150,000+ programs. Beyond the core application
  platform, ApplyBoard offers "360 Solutions" spanning language-test vouchers, financial
  services, and student loans, along with ApplyProof (a standalone document-verification
  service) and ApplyBoard Test Solutions. ApplyBoard does not currently publish a public
  developer API or developer portal; this profile captures its public web, security,
  and legal surface for the API Evangelist network.'
